# The blog's one workflow. It lives in the PUBLIC repository, which is also the
# published site, and it is the only thing anywhere that holds a credential for
# the private repository the site is written in.
#
# ── The ways a run starts ───────────────────────────────────────────────────
#
#   workflow_dispatch  editor  somebody saved in the online editor. The Worker
#                              starts this run right after the save is pushed to
#                              the queue branch, naming the queue commit. The
#                              payload is sealed and carries an Ed25519 receipt;
#                              verified, applied, built, published.
#                      source  a push to the private repository, relayed by the
#                              Worker's webhook. Built and published.
#                      nightly the Worker's cron. Built and published.
#   push to main       the admin built at home and pushed the artifact.
#                      Published as-is if it carries `Deploy-Signature:`;
#                      force-reset if it does not.
#
# ── Why a save is DISPATCHED rather than pushed into a run ──────────────────
#
# A save is a rootless commit holding one file. GitHub runs a push-triggered
# workflow from the workflow file in the PUSHED commit's tree — and that commit
# has none, so pushing a save started nothing at all. Dispatching runs the
# workflow from `main`, which is also the only copy of it the editor's token can
# never have touched.
#
# ── Why the deploy always publishes `main` ──────────────────────────────────
#
# The deploy job checks out `main` fresh and publishes that, never a working
# tree handed over from the build. A build that failed half way used to hand
# over whatever was left — which could be an empty directory, and GitHub Pages
# then answered every URL on the site with its own 404. `main` is the last
# artifact that was committed whole; the worst a failed build can now do is add
# its sealed log to it.
#
# ── What this file cannot become ────────────────────────────────────────────
#
# The editor's token is a fine-grained PAT with no `Workflows` permission, so
# GitHub itself refuses any write under `.github/workflows/`. Everything below
# decides whether a push is legitimate, and a push that could edit it would
# decide for itself. It is also why `ci/` is taken from `main`.
#
# ── Configuration ───────────────────────────────────────────────────────────
#
# Variables:
#   SOURCE_REPO          owner/name of the private repository (required)
#   SOURCE_BRANCH        default main
#   QUEUE_BRANCH         default editor-queue
#   RDFX_EDITOR_PUBKEY   Ed25519 public key; must match EDITOR_PUBLIC_KEY in the
#                        Worker and backend.online_editor.verify_key
#   NODE_VERSION         default 24
#
# Secrets:
#   VAULT_MASTER         opens .vault/keys.enc, unwraps a save's one-time key,
#                        and checks a local build's signature
#   SOURCE_REPO_TOKEN    fine-grained PAT on SOURCE_REPO: Contents read/write,
#                        Metadata read. NOT Workflows
#   UMAMI_TOKEN          optional; brings source/_data/analytics.json up to date

name: Build and deploy
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('{0} {1}', inputs.reason, inputs.queue_sha != '' && inputs.queue_sha || inputs.source_sha)
      || github.event.head_commit.message }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "editor, source, nightly or manual"
        default: manual
      queue_sha:
        description: "The queue commit an editor save was pushed as"
        default: ""
      source_sha:
        description: "The private-repo commit that asked for this run, if any"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Never cancel: a half-published artifact is worse than a queued one, and the
# editor refuses to save while a run is in flight for exactly this reason.
concurrency:
  group: blog
  cancel-in-progress: false

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}
  QUEUE_BRANCH: ${{ vars.QUEUE_BRANCH || 'editor-queue' }}
  GIT_TERMINAL_PROMPT: "0"
  TZ: UTC

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. What is this run, and is it allowed to happen
  # ════════════════════════════════════════════════════════════
  verify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      login: ${{ steps.receipt.outputs.login }}
      admin: ${{ steps.receipt.outputs.admin }}
      ids: ${{ steps.receipt.outputs.ids }}
    steps:
      # Inline rather than a script in `ci/`, because `ci/` lives on this branch
      # and a gate that ran from there would be guarding itself.
      - name: Account for a push to the published branch
        id: published
        if: github.event_name == 'push'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if printf '%s' "$MESSAGE" | grep -qiE '^Built-by:[[:space:]]*ci[[:space:]]*$'; then
            echo "verdict=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CLAIM=$(printf '%s' "$MESSAGE" | grep -iE '^Deploy-Signature:[[:space:]]*sha256=[0-9a-f]{64}[[:space:]]*$' | tail -1 | sed 's/.*sha256=/sha256=/' | tr -d '[:space:]')
          TREE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.tree.sha')
          EXPECT=$(TREE="$TREE" node -e '
            const c = require("node:crypto");
            const k = c.hkdfSync("sha256", Buffer.from(process.env.VAULT_MASTER, "base64url"),
                                 Buffer.alloc(0), Buffer.from("rdfx-deploy"), 32);
            process.stdout.write("sha256=" + c.createHmac("sha256", Buffer.from(k))
              .update(process.env.TREE, "utf8").digest("hex"));
          ')

          if [ -n "$CLAIM" ] && [ "$CLAIM" = "$EXPECT" ]; then
            echo "signed by a build that holds VAULT_MASTER"
            echo "verdict=deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::this commit carries no valid Deploy-Signature. Putting the branch back."
          BEFORE='${{ github.event.before }}'
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000)
              echo "::error::and there is nothing to put it back TO — reset it by hand."
              exit 1 ;;
          esac
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$BEFORE"
          git push -q --force origin "${BEFORE}:refs/heads/${GITHUB_REF_NAME}"
          exit 1

      # ── an editor save ────────────────────────────────────────────────────
      - name: Take the verifier from the published branch
        if: inputs.reason == 'editor'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: ci
          path: verifier

      # The exact commit the Worker named, not the branch tip: a second save
      # pushed in the meantime is its own run with its own receipt.
      - name: Take the save off the queue branch
        if: inputs.reason == 'editor'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.queue_sha }}
          fetch-depth: 1
          path: queue

      - name: Check the receipt the save carries
        id: receipt
        if: inputs.reason == 'editor'
        env:
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          RDFX_EDITOR_PUBKEY: ${{ vars.RDFX_EDITOR_PUBKEY }}
        run: |
          git -C queue log -1 --format=%B > "${RUNNER_TEMP}/message.txt"
          node verifier/ci/verify-receipt.mjs queue/payload.bin "${RUNNER_TEMP}/message.txt"

      - name: Clear a save that did not verify
        if: failure() && inputs.reason == 'editor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::refusing this save and clearing the queue"
          rm -rf "${RUNNER_TEMP}/empty" && mkdir -p "${RUNNER_TEMP}/empty" && cd "${RUNNER_TEMP}/empty"
          git init -q -b "$QUEUE_BRANCH" .
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "queue: empty"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${QUEUE_BRANCH}"

      - name: Say what this run is
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ steps.published.outputs.verdict || 'none' }}" >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════
  # 2. Build the site from the private repository
  # ════════════════════════════════════════════════════════════
  build:
    needs: verify
    if: needs.verify.outputs.mode == 'build'
    runs-on: ubuntu-latest
    env:
      VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
      # AVIF bytes depend on the machine's encoder, so none is started here:
      # img-optimizer serves what source/build/ already holds and gives anything
      # new a quick `sharp` AVIF that the next build at home re-encodes.
      RDFX_SKIP_AVIF: "1"
    steps:
      # FIRST, and on its own: the published artifact is what a failed build
      # falls back to and what its log is written into, so it has to exist
      # whatever happens to the steps after it.
      - name: Fetch the published artifact
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: site

      - name: Clone the private source
        env:
          TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          REPO: ${{ vars.SOURCE_REPO }}
        run: |
          [ -n "$REPO" ] || { echo "::error::SOURCE_REPO is not set"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::SOURCE_REPO_TOKEN is not set"; exit 1; }
          git clone -q --depth 1 --branch "${{ vars.SOURCE_BRANCH || 'main' }}" \
            "https://x-access-token:${TOKEN}@github.com/${REPO}.git" src \
            || { echo "::error::could not clone ${REPO} — check SOURCE_REPO_TOKEN"; exit 1; }
          # Only the theme. `public` is a submodule too, and the artifact is
          # moved into its place instead of being fetched a second time.
          git -C src submodule update --init themes/redefine-x \
            || { echo "::error::could not fetch the theme commit the source pins"; exit 1; }
          rm -rf src/public
          mv site src/public

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci
        working-directory: src

      # ── apply the save, if this run is one ────────────────────────────────
      #
      # The one-time key is unwrapped here from the commit message, inside the
      # only process that uses it: a workflow output and a workflow artifact are
      # both readable by anybody on a public repository.
      - name: Take the save off the queue branch
        if: inputs.reason == 'editor'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.queue_sha }}
          fetch-depth: 1
          path: queue

      - name: Apply the save, or refuse the whole of it
        id: apply
        if: inputs.reason == 'editor'
        run: |
          WRAPPED=$(git -C queue log -1 --format=%B | grep -iE '^Editor-Key:' | tail -1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '[:space:]')
          node src/themes/redefine-x/workflows/ci/apply.mjs \
            --payload queue/payload.bin \
            --wrapped "$WRAPPED" \
            --ids '${{ needs.verify.outputs.ids }}' \
            --admin '${{ needs.verify.outputs.admin }}' \
            --src src > "${RUNNER_TEMP}/applied.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/applied.json","utf8"));console.log(`applied ${r.wrote} write(s) and ${r.removed} removal(s) across ${r.items.length} item(s)`);require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`message=${String(r.message||"").replace(/\r?\n/g," ")}\n`)'

      # ── the build itself ──────────────────────────────────────────────────
      #
      # Nothing it prints reaches this public run log: the log names every file
      # the build touched, which for encrypted articles is the very thing being
      # protected. It is sealed and published where only the console opens it.
      - name: Render the site
        id: render
        continue-on-error: true
        working-directory: src
        env:
          UMAMI_TOKEN: ${{ secrets.UMAMI_TOKEN }}
          FORCE_COLOR: "1"
        run: |
          set -o pipefail
          { npm run clean && npm run build; } > "${RUNNER_TEMP}/build.log" 2>&1

      # A failed build leaves public/ half-written — `hexo clean` emptied it
      # first. Everything tracked goes back to the last committed artifact and
      # everything new goes, so the only change left to commit is the log.
      - name: Put the previous artifact back if the build failed
        if: always() && steps.render.outcome != 'success'
        run: |
          [ -d src/public/.git ] || exit 0
          echo "::warning::the build failed — republishing the previous artifact with its log"
          git -C src/public checkout -q -- .
          git -C src/public clean -qfd

      - name: Seal the build log into the site
        if: always()
        run: |
          [ -f src/.vault/keys.enc ] && [ -d src/public ] || { echo "no source to seal a log with"; exit 0; }
          [ -f "${RUNNER_TEMP}/build.log" ] || echo "(the build never started)" > "${RUNNER_TEMP}/build.log"
          node src/themes/redefine-x/workflows/ci/seal-log.mjs \
            --src src --out src/public --log "${RUNNER_TEMP}/build.log" \
            --status '${{ steps.render.outcome || 'skipped' }}' \
            --reason '${{ inputs.reason || github.event_name }}'

      # ── publish ───────────────────────────────────────────────────────────
      - name: Commit the artifact
        if: always()
        env:
          WHO: ${{ needs.verify.outputs.login }}
        run: |
          [ -d src/public/.git ] || { echo "no artifact checkout"; exit 0; }
          cd src/public
          # Refused rather than published: an artifact with no home page is a
          # site that answers every URL with 404.
          [ -f index.html ] || { echo "::error::the artifact has no index.html — not publishing it"; exit 1; }
          NAME="${WHO:-${{ vars.COMMIT_AUTHOR_NAME || 'Jason-JP-Yang' }}}"
          MAIL="${{ vars.COMMIT_AUTHOR_EMAIL || 'jiepengyang@outlook.com' }}"
          git add -A
          # The runner's token may not write under .github/workflows/; a theme
          # release that changes a workflow reaches this repository from a
          # build at home instead.
          if ! git diff --cached --quiet -- .github; then
            echo "::warning::.github/ changed — push it from a local build; unstaged here"
            git reset -q -- .github
          fi
          if git diff --cached --quiet; then
            echo "artifact unchanged"
            exit 0
          fi
          git -c user.name="$NAME" -c user.email="$MAIL" commit -q -F - <<EOF
          Site updated: $(date -u +'%Y-%m-%d %H:%M:%SZ')

          Built-by: ci
          EOF
          git push -q origin "HEAD:${{ github.event.repository.default_branch }}"

      # What the source keeps from the build: the resealed keyring, the save
      # itself, the picture moves, the references the moves rewrote — including
      # the root `_config*.yml`, which name covers, avatars and banners — and the
      # artifact pointer. The configs are staged EXPLICITLY: the journal is
      # consumed by the build that rewrites them, so a rewrite left uncommitted
      # is a path that goes stale the moment the next build reads the file.
      # Pushed even when the build failed, so an author's work is never lost to
      # a broken build — the log in Blog Management says what to fix.
      # `Built-by: ci` stops the private repository's webhook relaying this back
      # into another build.
      - name: Return the source's half of the build
        if: always()
        env:
          TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          REPO: ${{ vars.SOURCE_REPO }}
          WHO: ${{ needs.verify.outputs.login }}
          SUBJECT: ${{ steps.apply.outputs.message }}
        run: |
          [ -d src/.git ] || { echo "no source checkout"; exit 0; }
          cd src
          git add -A -- .vault source public '_config*.yml'
          if git diff --cached --quiet; then
            echo "the source has nothing to take back"
            exit 0
          fi
          NAME="${WHO:-${{ vars.COMMIT_AUTHOR_NAME || 'Jason-JP-Yang' }}}"
          MAIL="${{ vars.COMMIT_AUTHOR_EMAIL || 'jiepengyang@outlook.com' }}"
          git -c user.name="$NAME" -c user.email="$MAIL" commit -q -F - <<EOF
          ${SUBJECT:-build: reseal the keyring and settle the artifact pointer}

          Built-by: ci
          EOF
          git push -q "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
            "HEAD:${{ vars.SOURCE_BRANCH || 'main' }}"

      - name: Empty the queue
        if: always() && inputs.reason == 'editor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "${RUNNER_TEMP}/empty" && mkdir -p "${RUNNER_TEMP}/empty" && cd "${RUNNER_TEMP}/empty"
          git init -q -b "$QUEUE_BRANCH" .
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "queue: empty"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${QUEUE_BRANCH}"

      - name: Fail the run if the build failed
        if: steps.render.outcome != 'success'
        run: |
          echo "::error::the build failed. Its log is in Blog Management; the previous site is still published."
          exit 1

  # ════════════════════════════════════════════════════════════
  # 3. Publish whatever `main` now is
  # ════════════════════════════════════════════════════════════
  deploy:
    needs: [verify, build]
    # After a build whether it succeeded or failed — a failed one has committed
    # its log onto the previous artifact, and that is worth publishing. Never
    # after a verify that refused the run.
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.mode == 'deploy' ||
       (needs.verify.outputs.mode == 'build' &&
        (needs.build.result == 'success' || needs.build.result == 'failure')))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Refuse to publish a site with no home page
        run: |
          [ -f index.html ] || { echo "::error::main has no index.html — nothing published"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
