# The blog's one workflow. It lives in the PUBLIC repository, which is also the
# published site, and it is the only thing anywhere that holds a credential for
# the private repository the site is written in.
#
# Three jobs, always in this order:
#
#   verify  what this run is, and whether it may happen at all
#   build   render the site from the private repository and commit it to main
#   deploy  GitHub Pages: publish main.  Vercel / Cloudflare Pages: they deploy
#           every push to main themselves, so wait until the site's
#           version.json names the build on main; fail after two minutes.
#
# ── Two ways to verify ──────────────────────────────────────────────────────
#
# Locked: DEPLOY_KEY is set AND a ruleset on main restricts updates, with
# Deploy keys as its only bypass. Nothing but this workflow can move main.
#
#   push to publish    the admin's local build (`npm run deploy`). Must be a
#                      GPG-verified commit by the repository owner. Its tree is
#                      committed on top of main through the key and deployed;
#                      publish is then emptied again.
#   push to main       only this workflow can make one; nothing to do.
#   editor save        the receipt below.
#
# Open: anything else. Every run warns, because Vercel and Cloudflare Pages
# have already deployed a push to main before any run can look at it.
#
#   push to main       must be a GPG-verified commit by the repository owner;
#                      put back otherwise. The workflow's own pushes use
#                      GITHUB_TOKEN, which starts no run.
#   push to publish    refused.
#   editor save        the receipt below.
#
# Neither publish nor editor-queue is a site: turn off Vercel / Cloudflare
# preview deploys for both. With GitHub Pages and a locked main, allow
# `publish` in the github-pages environment's deployment branches.
#
# ── Why a save is DISPATCHED rather than pushed into a run ──────────────────
#
# A save is a rootless commit holding one file. GitHub runs a push-triggered
# workflow from the workflow file in the PUSHED commit's tree — and that commit
# has none, so pushing a save started nothing at all. Dispatching runs the
# workflow from `main`, which is also the only copy of it the editor's token can
# never have touched.
#
# ── What this file cannot become ────────────────────────────────────────────
#
# The editor's token is a fine-grained PAT with no `Workflows` permission, so
# GitHub itself refuses any write under `.github/workflows/`. Everything below
# decides whether a push is legitimate, and a push that could edit it would
# decide for itself. It is also why `ci/` is taken from `main`.
#
# ── Configuration ───────────────────────────────────────────────────────────
#
# The site's own `deploy:` block arrives as ci/deploy.json: the platform, the
# address polled for version.json, the admin every site commit is authored as,
# and the bot that empties publish and editor-queue.
#
# Variables:
#   SOURCE_REPO          owner/name of the private repository (required)
#   SOURCE_BRANCH        default main
#   QUEUE_BRANCH         default editor-queue
#   RDFX_EDITOR_PUBKEY   Ed25519 public key; must match EDITOR_PUBLIC_KEY in the
#                        Worker and backend.online_editor.verify_key
#   NODE_VERSION         default 24
#
# Secrets:
#   VAULT_MASTER         opens .vault/keys.enc and unwraps a save's one-time key
#   SOURCE_REPO_TOKEN    fine-grained PAT on SOURCE_REPO: Contents read/write,
#                        Metadata read. NOT Workflows
#   DEPLOY_KEY           private half of a deploy key with write access
#   UMAMI_TOKEN          optional; brings source/_data/analytics.json up to date

name: Build and deploy
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('{0} {1}', inputs.reason, inputs.queue_sha != '' && inputs.queue_sha || inputs.source_sha)
      || github.event.head_commit.message }}

on:
  push:
    branches: [main, publish]
  workflow_dispatch:
    inputs:
      reason:
        description: "editor, source, nightly or manual"
        default: manual
      queue_sha:
        description: "The queue commit an editor save was pushed as"
        default: ""
      source_sha:
        description: "The private-repo commit that asked for this run, if any"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Never cancel: a half-published artifact is worse than a queued one, and the
# editor refuses to save while a run is in flight for exactly this reason.
concurrency:
  group: blog
  cancel-in-progress: false

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}
  QUEUE_BRANCH: ${{ vars.QUEUE_BRANCH || 'editor-queue' }}
  GIT_TERMINAL_PROMPT: "0"
  TZ: UTC

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. What is this run, and is it allowed to happen
  # ════════════════════════════════════════════════════════════
  verify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      locked: ${{ steps.settings.outputs.locked }}
      platform: ${{ steps.settings.outputs.platform }}
      ci_url: ${{ steps.settings.outputs.ci_url }}
      author: ${{ steps.settings.outputs.author }}
      email: ${{ steps.settings.outputs.email }}
      bot_email: ${{ steps.settings.outputs.bot_email }}
      admin: ${{ steps.receipt.outputs.admin }}
      ids: ${{ steps.receipt.outputs.ids }}
    steps:
      # The artifact this run starts from says how the site is deployed; the
      # repository's own settings say which way to verify.
      - name: Read the deploy settings
        id: settings
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.DEPLOY_KEY != '' }}
        run: |
          SETTINGS=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci/deploy.json?ref=${GITHUB_SHA}" -H "Accept: application/vnd.github.raw" 2>/dev/null) || SETTINGS='{}'
          jq -r '"platform=\(.platform // "github-pages")", "ci_url=\(.ci_url // "")", "author=\(.author // "")", "email=\(.email // "")", "bot_email=\(.bot_email // .email // "")"' <<<"$SETTINGS" >> "$GITHUB_OUTPUT"

          UPDATES=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" --jq 'any(.[]; .type == "update")' 2>/dev/null || echo false)
          if [ "$HAS_KEY" = "true" ] && [ "$UPDATES" = "true" ]; then
            echo "locked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "locked=false" >> "$GITHUB_OUTPUT"
          if [ "$UPDATES" = "true" ]; then
            echo "::error title=No DEPLOY_KEY::main is locked by a ruleset but DEPLOY_KEY is not set, so nothing this workflow builds can reach main."
          elif [ "$HAS_KEY" = "true" ]; then
            echo "::warning title=main is not locked::DEPLOY_KEY is set, but no ruleset restricts updates to main. Verifying admin pushes to main by GPG until one does."
          else
            echo "::warning title=No DEPLOY_KEY::Admin pushes to main are checked for a GPG-verified commit only after Vercel or Cloudflare Pages has deployed them. Add a write deploy key as DEPLOY_KEY and a ruleset on main that restricts updates to it, then push local builds to publish."
          fi

      # Inline rather than a script in `ci/`, because `ci/` lives on this branch
      # and a gate that ran from there would be guarding itself.
      - name: Account for a push
        id: published
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          LOCKED: ${{ steps.settings.outputs.locked }}
          AUTHOR: ${{ steps.settings.outputs.author }}
          EMAIL: ${{ steps.settings.outputs.email }}
          BOT_EMAIL: ${{ steps.settings.outputs.bot_email }}
          DEPLOY_KEY: ${{ steps.settings.outputs.locked == 'true' && secrets.DEPLOY_KEY || '' }}
        run: |
          ORIGIN="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The owner's own signature, as GitHub verified it. A commit made
          # through the API is signed by `web-flow`, not the owner, so fails.
          SIGNED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --jq '.commit.verification.verified == true and .committer.login == env.GITHUB_REPOSITORY_OWNER')

          case "$GITHUB_REF_NAME:$LOCKED" in
            main:true)
              echo "main moves only through this workflow; the run that moved it deploys it"
              echo "verdict=none" >> "$GITHUB_OUTPUT"
              ;;

            main:false)
              if [ "$SIGNED" = "true" ]; then
                echo "a GPG-verified commit by ${GITHUB_REPOSITORY_OWNER}"
                echo "verdict=deploy" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::${GITHUB_SHA::7} is not a GPG-verified commit by ${GITHUB_REPOSITORY_OWNER}. Putting main back."
              case "$BEFORE" in
                ""|0000000000000000000000000000000000000000)
                  echo "::error::and there is nothing to put it back TO — reset it by hand."
                  exit 1 ;;
              esac
              git init -q "$RUNNER_TEMP/reset" && cd "$RUNNER_TEMP/reset"
              git fetch -q --depth 1 --filter=blob:none "$ORIGIN" "$BEFORE"
              git push -q --force "$ORIGIN" "${BEFORE}:refs/heads/main"
              exit 1
              ;;

            publish:true)
              [ "$SIGNED" = "true" ] || { echo "::error::${GITHUB_SHA::7} is not a GPG-verified commit by ${GITHUB_REPOSITORY_OWNER}. Nothing promoted."; exit 1; }
              [ -n "$AUTHOR" ] && [ -n "$EMAIL" ] || { echo "::error::ci/deploy.json names no author or email — set deploy.author and deploy.email"; exit 1; }

              # The deploy key is on disk only until this step ends.
              printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key" && chmod 600 "$RUNNER_TEMP/deploy_key"
              trap 'rm -f "$RUNNER_TEMP/deploy_key"' EXIT
              gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
              export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"

              # The build's tree goes on top of main's latest commit, whatever
              # publish was based on: nothing on main is rewritten.
              git init -q "$RUNNER_TEMP/promote" && cd "$RUNNER_TEMP/promote"
              git fetch -q --depth 1 --filter=blob:none "git@github.com:${GITHUB_REPOSITORY}.git" "$GITHUB_SHA" "+refs/heads/main:refs/remotes/origin/main"
              TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")
              if [ "$TREE" = "$(git rev-parse 'origin/main^{tree}')" ]; then
                echo "main already publishes this tree"
                echo "verdict=none" >> "$GITHUB_OUTPUT"
              else
                NEXT=$(printf '%s\n' "$MESSAGE" | git interpret-trailers --trailer "Promoted-from: ${GITHUB_SHA}" \
                  | git -c user.name="$AUTHOR" -c user.email="$EMAIL" commit-tree "$TREE" -p origin/main)
                git push -q "git@github.com:${GITHUB_REPOSITORY}.git" "${NEXT}:refs/heads/main"
                echo "promoted ${GITHUB_SHA::7} to main as ${NEXT::7}"
                echo "verdict=deploy" >> "$GITHUB_OUTPUT"
              fi

              # Emptied the way editor-queue is, through GITHUB_TOKEN, which
              # starts no run.
              git init -q -b publish "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
              git -c user.name=ci -c user.email="$BOT_EMAIL" commit -q --allow-empty -m "publish: empty"
              git push -q --force "$ORIGIN" "HEAD:refs/heads/publish"
              ;;

            publish:false)
              echo "::error::publish is promoted only with DEPLOY_KEY and a ruleset locking main — push local builds to main."
              exit 1
              ;;
          esac

      # ── an editor save ────────────────────────────────────────────────────
      - name: Take the verifier from the published branch
        if: inputs.reason == 'editor'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: ci
          path: verifier

      # The exact commit the Worker named, not the branch tip: a second save
      # pushed in the meantime is its own run with its own receipt.
      - name: Take the save off the queue branch
        if: inputs.reason == 'editor'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.queue_sha }}
          fetch-depth: 1
          path: queue

      - name: Check the receipt the save carries
        id: receipt
        if: inputs.reason == 'editor'
        env:
          VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
          RDFX_EDITOR_PUBKEY: ${{ vars.RDFX_EDITOR_PUBKEY }}
        run: |
          git -C queue log -1 --format=%B > "${RUNNER_TEMP}/message.txt"
          node verifier/ci/verify-receipt.mjs queue/payload.bin "${RUNNER_TEMP}/message.txt"

      - name: Clear a save that did not verify
        if: failure() && inputs.reason == 'editor'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_EMAIL: ${{ steps.settings.outputs.bot_email }}
        run: |
          echo "::error::refusing this save and clearing the queue"
          rm -rf "${RUNNER_TEMP}/empty" && mkdir -p "${RUNNER_TEMP}/empty" && cd "${RUNNER_TEMP}/empty"
          git init -q -b "$QUEUE_BRANCH" .
          git -c user.name=ci -c user.email="$BOT_EMAIL" commit -q --allow-empty -m "queue: empty"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${QUEUE_BRANCH}"

      - name: Say what this run is
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ steps.published.outputs.verdict || 'none' }}" >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════
  # 2. Build the site from the private repository
  # ════════════════════════════════════════════════════════════
  build:
    needs: verify
    if: needs.verify.outputs.mode == 'build'
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.commit.outputs.platform }}
      ci_url: ${{ steps.commit.outputs.ci_url }}
    env:
      VAULT_MASTER: ${{ secrets.VAULT_MASTER }}
      # AVIF bytes depend on the machine's encoder, so none is started here:
      # img-optimizer serves what source/build/ already holds and gives anything
      # new a quick `sharp` AVIF that the next build at home re-encodes.
      RDFX_SKIP_AVIF: "1"
      # Every commit of the site is the admin's, whoever saved.
      AUTHOR: ${{ needs.verify.outputs.author }}
      EMAIL: ${{ needs.verify.outputs.email }}
    steps:
      # FIRST, and on its own: the published artifact is what a failed build
      # falls back to and what its log is written into, so it has to exist
      # whatever happens to the steps after it.
      - name: Fetch the published artifact
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: site

      - name: Clone the private source
        env:
          TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          REPO: ${{ vars.SOURCE_REPO }}
        run: |
          [ -n "$REPO" ] || { echo "::error::SOURCE_REPO is not set"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::SOURCE_REPO_TOKEN is not set"; exit 1; }
          [ -n "$AUTHOR" ] && [ -n "$EMAIL" ] || { echo "::error::ci/deploy.json on main names no author or email — set deploy.author and deploy.email and deploy once from home"; exit 1; }
          git clone -q --depth 1 --branch "${{ vars.SOURCE_BRANCH || 'main' }}" \
            "https://x-access-token:${TOKEN}@github.com/${REPO}.git" src \
            || { echo "::error::could not clone ${REPO} — check SOURCE_REPO_TOKEN"; exit 1; }
          # Only the theme. `public` is a submodule too, and the artifact is
          # moved into its place instead of being fetched a second time.
          git -C src submodule update --init themes/redefine-x \
            || { echo "::error::could not fetch the theme commit the source pins"; exit 1; }
          rm -rf src/public
          mv site src/public

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci
        working-directory: src

      # ── apply the save, if this run is one ────────────────────────────────
      #
      # The one-time key is unwrapped here from the commit message, inside the
      # only process that uses it: a workflow output and a workflow artifact are
      # both readable by anybody on a public repository.
      - name: Take the save off the queue branch
        if: inputs.reason == 'editor'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.queue_sha }}
          fetch-depth: 1
          path: queue

      - name: Apply the save, or refuse the whole of it
        id: apply
        if: inputs.reason == 'editor'
        run: |
          WRAPPED=$(git -C queue log -1 --format=%B | grep -iE '^Editor-Key:' | tail -1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '[:space:]')
          node src/themes/redefine-x/workflows/ci/apply.mjs \
            --payload queue/payload.bin \
            --wrapped "$WRAPPED" \
            --ids '${{ needs.verify.outputs.ids }}' \
            --admin '${{ needs.verify.outputs.admin }}' \
            --src src > "${RUNNER_TEMP}/applied.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/applied.json","utf8"));console.log(`applied ${r.wrote} write(s) and ${r.removed} removal(s) across ${r.items.length} item(s)`);require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`message=${String(r.message||"").replace(/\r?\n/g," ")}\n`)'

      # ── the build itself ──────────────────────────────────────────────────
      #
      # Nothing it prints reaches this public run log: the log names every file
      # the build touched, which for encrypted articles is the very thing being
      # protected. It is sealed and published where only the console opens it.
      - name: Render the site
        id: render
        continue-on-error: true
        working-directory: src
        env:
          UMAMI_TOKEN: ${{ secrets.UMAMI_TOKEN }}
          FORCE_COLOR: "1"
        run: |
          set -o pipefail
          { npm run clean && npm run build; } > "${RUNNER_TEMP}/build.log" 2>&1

      # A failed build leaves public/ half-written — `hexo clean` emptied it
      # first. Everything tracked goes back to the last committed artifact and
      # everything new goes, so the only change left to commit is the log.
      - name: Put the previous artifact back if the build failed
        if: always() && steps.render.outcome != 'success'
        run: |
          [ -d src/public/.git ] || exit 0
          echo "::warning::the build failed — republishing the previous artifact with its log"
          git -C src/public checkout -q -- .
          git -C src/public clean -qfd

      - name: Seal the build log into the site
        if: always()
        run: |
          [ -f src/.vault/keys.enc ] && [ -d src/public ] || { echo "no source to seal a log with"; exit 0; }
          [ -f "${RUNNER_TEMP}/build.log" ] || echo "(the build never started)" > "${RUNNER_TEMP}/build.log"
          node src/themes/redefine-x/workflows/ci/seal-log.mjs \
            --src src --out src/public --log "${RUNNER_TEMP}/build.log" \
            --status '${{ steps.render.outcome || 'skipped' }}' \
            --reason '${{ inputs.reason || github.event_name }}'

      # ── publish ───────────────────────────────────────────────────────────
      #
      # Locked, main takes nothing but the deploy key; the push it makes starts
      # a run that verify recognises and leaves alone. Open, GITHUB_TOKEN
      # pushes, which starts no run at all.
      - name: Commit the artifact
        id: commit
        if: always()
        env:
          DEPLOY_KEY: ${{ needs.verify.outputs.locked == 'true' && secrets.DEPLOY_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d src/public/.git ] || { echo "no artifact checkout"; exit 0; }
          cd src/public
          # Refused rather than published: an artifact with no home page is a
          # site that answers every URL with 404.
          [ -f index.html ] || { echo "::error::the artifact has no index.html — not publishing it"; exit 1; }
          jq -r '"platform=\(.platform // "")", "ci_url=\(.ci_url // "")"' ci/deploy.json >> "$GITHUB_OUTPUT" 2>/dev/null || true
          git add -A
          # GITHUB_TOKEN may not write under .github/workflows/; a deploy key
          # may. Without one, a theme release that changes a workflow reaches
          # this repository from a build at home instead.
          if [ -z "$DEPLOY_KEY" ] && ! git diff --cached --quiet -- .github; then
            echo "::warning::.github/ changed — push it from a local build; unstaged here"
            git reset -q -- .github
          fi
          if git diff --cached --quiet; then
            echo "artifact unchanged"
            exit 0
          fi
          git -c user.name="$AUTHOR" -c user.email="$EMAIL" commit -q -F - <<EOF
          Site updated: $(date -u +'%Y-%m-%d %H:%M:%SZ')

          Built-by: ci
          EOF
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key" && chmod 600 "$RUNNER_TEMP/deploy_key"
            trap 'rm -f "$RUNNER_TEMP/deploy_key"' EXIT
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
              git push -q "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/main"
          else
            git push -q origin "HEAD:refs/heads/main"
          fi

      # What the source keeps from the build: the resealed keyring, the save
      # itself, the picture moves, the references the moves rewrote — including
      # the root `_config*.yml`, which name covers, avatars and banners — and the
      # artifact pointer. The configs are staged EXPLICITLY: the journal is
      # consumed by the build that rewrites them, so a rewrite left uncommitted
      # is a path that goes stale the moment the next build reads the file.
      # Pushed even when the build failed, so an author's work is never lost to
      # a broken build — the log in Blog Management says what to fix.
      # `Built-by: ci` stops the private repository's webhook relaying this back
      # into another build.
      - name: Return the source's half of the build
        if: always()
        env:
          TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          REPO: ${{ vars.SOURCE_REPO }}
          SUBJECT: ${{ steps.apply.outputs.message }}
        run: |
          [ -d src/.git ] || { echo "no source checkout"; exit 0; }
          cd src
          git add -A -- .vault source public '_config*.yml'
          if git diff --cached --quiet; then
            echo "the source has nothing to take back"
            exit 0
          fi
          git -c user.name="$AUTHOR" -c user.email="$EMAIL" commit -q -F - <<EOF
          ${SUBJECT:-build: reseal the keyring and settle the artifact pointer}

          Built-by: ci
          EOF
          git push -q "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
            "HEAD:${{ vars.SOURCE_BRANCH || 'main' }}"

      - name: Empty the queue
        if: always() && inputs.reason == 'editor'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_EMAIL: ${{ needs.verify.outputs.bot_email }}
        run: |
          rm -rf "${RUNNER_TEMP}/empty" && mkdir -p "${RUNNER_TEMP}/empty" && cd "${RUNNER_TEMP}/empty"
          git init -q -b "$QUEUE_BRANCH" .
          git -c user.name=ci -c user.email="$BOT_EMAIL" commit -q --allow-empty -m "queue: empty"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${QUEUE_BRANCH}"

      - name: Fail the run if the build failed
        if: steps.render.outcome != 'success'
        run: |
          echo "::error::the build failed. Its log is in Blog Management; the previous site is still published."
          exit 1

  # ════════════════════════════════════════════════════════════
  # 3. Publish whatever `main` now is
  # ════════════════════════════════════════════════════════════
  deploy:
    needs: [verify, build]
    # After a build whether it succeeded or failed — a failed one has committed
    # its log onto the previous artifact, and that is worth publishing. Never
    # after a verify that refused the run.
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.mode == 'deploy' ||
       (needs.verify.outputs.mode == 'build' &&
        (needs.build.result == 'success' || needs.build.result == 'failure')))
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ needs.build.outputs.platform || needs.verify.outputs.platform || 'github-pages' }}
      CI_URL: ${{ needs.build.outputs.ci_url || needs.verify.outputs.ci_url }}
    # Only GitHub Pages is an environment of this repository; an empty name runs
    # the job with none.
    environment:
      name: ${{ (needs.build.outputs.platform || needs.verify.outputs.platform || 'github-pages') == 'github-pages' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `main` fresh, never a working tree handed over from the build: a build
      # that failed half way could hand over an empty directory, and Pages
      # would then answer every URL with its own 404.
      - uses: actions/checkout@v4
        if: env.PLATFORM == 'github-pages'
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Refuse to publish a site with no home page
        if: env.PLATFORM == 'github-pages'
        run: |
          [ -f index.html ] || { echo "::error::main has no index.html — nothing published"; exit 1; }

      - uses: actions/configure-pages@v5
        if: env.PLATFORM == 'github-pages'
      - uses: actions/upload-pages-artifact@v3
        if: env.PLATFORM == 'github-pages'
        with:
          path: "."
      - id: deployment
        if: env.PLATFORM == 'github-pages'
        uses: actions/deploy-pages@v4

      # The platform deploys the push itself; this waits until the site serves
      # the build main carries. CI_URL is deploy.ci_url — an address outside
      # the site's WAF, which answers a runner with 403.
      - name: Wait for ${{ env.PLATFORM }} to serve main
        if: env.PLATFORM != 'github-pages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CI_URL" ] || { echo "::error::ci/deploy.json names no address to poll"; exit 1; }
          BUILD=$(gh api "repos/${GITHUB_REPOSITORY}/contents/version.json?ref=${{ github.event.repository.default_branch }}" \
            -H "Accept: application/vnd.github.raw" | jq -r '.build // empty')
          [ -n "$BUILD" ] || { echo "::error::main's version.json names no build"; exit 1; }
          LIVE=""
          END=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$END" ]; do
            LIVE=$(curl -fsS "${CI_URL}version.json?t=$(date +%s%N)" | jq -r '.build // empty' 2>/dev/null || true)
            [ "$LIVE" = "$BUILD" ] && { echo "${PLATFORM} serves build ${BUILD::7}"; exit 0; }
            sleep 5
          done
          echo "::error::${CI_URL} still serves ${LIVE:-nothing} after two minutes, not build ${BUILD::7}"
          exit 1
