guide:
  label: 導覽
  you: 你
  kicker: 提示
  note_kicker: 作者註記
  note_title: 來自作者的說明
  understand: 知道了
  more: 查看詳情
  later: 稍後
  next: 下一步
  back: 上一步
  done: 完成
  close: 關閉
  try: 親自試試
  watch: 再看一次
  your_turn: 輪到你了
  try_done: 完成——就是這麼簡單。
  menu_title: 使用指南
  menu_lede: 本部落格中功能多於外觀所示的部分，各有一份示範。可隨時開啟，不會變更任何設定。
  menu_steps: "{n} 步"
  reset: 重新顯示所有提示
  reset_confirm: 再按一次以確認
  reset_done: 所有提示將重新出現
  reset_note: 已標記為「知道了」的提示會在瀏覽時重新出現，其他內容不受影響。
  tips:
    follow:
      title: 追蹤本部落格
      body: 新文章、即時筆記與公告會送達本站的收件匣；如果允許通知，也會以推播的形式送達這台裝置。只需一次 GitHub 登入，再按一下按鈕。
    bell:
      title: 收件匣在這裡
      body: 追蹤的內容依時間倒序匯集在鈴鐺之後。在其中開啟<b>管理訂閱</b>，可選擇接收的主題與接收推播的裝置。
    ios_push:
      title: iPhone 上的推播還差一步
      body: iOS 只向已加入主畫面的網站傳送通知。將本部落格加入主畫面並從圖示開啟，推播即可生效；收件匣不受此限制。
    navbar:
      title: 所有入口都在選單中
      body: <b>文章</b>下有歸檔、標籤、分類與照片牆；<b>關於</b>與<b>連結</b>收納站內其餘頁面。
    navbar_mobile:
      title: 選單
      body: 歸檔、標籤、分類、照片牆以及站內其餘頁面，都在這個按鈕之後。
    notes:
      title: 即時筆記
      body: 簡短的近況會以氣泡形式在這裡浮現——不必單獨成文的隻字片語。
    masonry:
      title: 照片牆
      body: 以瀑布流排列的相簿。任何一張照片都能以完整尺寸開啟，許多照片還附有拍攝時的相機參數。
    posts:
      title: 每個方塊都是一篇文章
      body: 方塊的大小取決於文章的篇幅，置頂文章排在最前，同一系列的文章匯集為一欄。開啟任一方塊即可閱讀。
    pulse:
      title: 站點活躍度
      body: 每個方格代表過去一年中的一天，顏色越深，當天的造訪越多。
    pager:
      title: 不只一位作者
      body: 這張卡片會依序切換到每位協作者。按圓點可直接跳轉，也可以滑動卡片。
    exif_toggle:
      title: 這張照片附有相機參數
      body: 按下箭頭即可展開拍攝資訊——相機、鏡頭、曝光等。
    exif_hover:
      title: 這張照片是怎麼拍的
      body: 這張卡片列出相機、鏡頭與曝光參數。指標停留在此類照片上時就會出現，圖片檢視器中同樣可以查看。
    viewer:
      title: 開啟任一圖片
      body: 按下圖片即可以完整尺寸檢視。可以放大、拖曳查看細節，並在不離開檢視器的情況下瀏覽文中的每一張圖片。
    errorbook:
      title: 先作答，再看解析
      body: 請先自行作答。答對不會有任何提示；答錯時會展開錯誤原因的解析。
    code:
      title: 複製或摺疊程式碼
      body: 指標移到程式碼區塊上時會出現這兩個按鈕。<b>複製</b>會複製整個區塊（不含行號），箭頭則可將其摺疊。
    toc:
      title: 目錄
      body: 顯示或隱藏目錄。正在閱讀的章節會保持醒目標示，任一標題一按即達。
    tools:
      title: 閱讀工具
      body: 字體大小、深色模式，以及跳至頁面頂端或底端，都在這裡。
    comments:
      title: 參與討論
      body: 本部落格的留言基於 GitHub Discussions。使用 GitHub 登入一次後，即可在任一文章下留言、回覆與表態。
    guide_entry:
      title: 隨時重溫所有指南
      body: 這組工具中的指南針可開啟所有示範，也能讓已關閉的提示重新出現。
    album_photo:
      title: 瀏覽相簿
      body: 開啟一張照片即可以完整尺寸檢視，再透過滑動或箭頭瀏覽整本相簿。
    album_heart:
      title: 為照片按讚
      body: 愛心會以你的 GitHub 帳號為照片按讚。第一次按下時需要登入，返回後按讚會自動完成。
    albums:
      title: 相簿
      body: 每張卡片都是一本相簿，開啟後照片會以瀑布流排列。
    search:
      title: 全站搜尋
      body: 輸入的同時，會檢索每篇文章的標題與全文。
  tours:
    follow:
      name: 追蹤本部落格
      desc: 收件匣、推播通知，以及登入的方式。
      signed_in: 你已經以 <b>@{login}</b> 登入，GitHub 相關的步驟皆已完成。
      steps:
        why:
          title: 追蹤之後會得到什麼
          body: 追蹤後，新文章、即時筆記與公告會進入本站的收件匣，位於導覽列的鈴鐺之後。如果同時允許通知，這些內容還會以推播通知送達這台裝置，即使部落格沒有開啟。接收的主題可自行選擇，也可以隨時取消追蹤。
        github:
          title: 一個 GitHub 帳號
          body: 登入本部落格使用的是 GitHub 帳號，與留言所用的是同一個。如果還沒有帳號，請在 <b>github.com/signup</b> 註冊：填寫電子郵件、密碼與使用者名稱，完成簡短的真人驗證，再輸入 GitHub 寄到信箱的驗證碼。註冊免費，大約需要兩分鐘。已有帳號可直接進入下一步。
        authorize:
          title: 透過 giscus 登入
          body: 按下<b>追蹤</b>後，部落格會將你帶到 GitHub，為留言背後的應用程式 <b>giscus</b> 授權。它會請求：驗證你的 GitHub 身分、了解你可存取的資源、代表你執行操作——你寫下的留言正是由此發布。按下 <b>Authorize giscus</b> 後會回到部落格，並已處於登入狀態。授權可隨時在 GitHub 的 Settings → Applications 中撤銷。
        ios:
          title: 在 iPhone 與 iPad 上，先加入主畫面
          body: iOS 與 iPadOS 只向安裝到主畫面的網站傳送網頁推播。在 Safari 中點一下 <b>⋯</b>，再點一下<b>分享</b>（若標籤頁佈局為「底部」或「頂部」，可直接點一下分享），向下捲動找到<b>加入主畫面</b>，開啟<b>以網頁 App 開啟</b>，然後點一下<b>加入</b>。之後從新圖示開啟部落格，再在其中追蹤。需要 iOS 16.4 或以上版本。
        allow:
          title: 追蹤，並允許通知
          body: 回到部落格後按下<b>追蹤</b>。瀏覽器會詢問是否允許本站顯示通知——選擇<b>允許</b>即可在這台裝置上接收推播。選擇<b>封鎖</b>同樣會完成追蹤：所有內容照常進入收件匣，只是沒有提醒。追蹤完成後，追蹤按鈕會變為鈴鐺。
        inbox:
          title: 鈴鐺就是收件匣
          body: 追蹤的內容依時間倒序匯集在鈴鐺之後，未讀數量顯示在標記上。<b>管理訂閱</b>可在新文章、即時筆記與公告之間選擇，列出所有註冊了推播的瀏覽器並可逐一移除，也可以完全取消追蹤。
        push:
          title: 有新內容發布時
          body: 新文章會以通知的形式送達，附帶標題與開頭幾行，按下即可開啟文章。只有在內容發布時才會傳送通知，絕不用於留言或推廣。在某個瀏覽器中登出會停止該處的推播，重新登入後會自動恢復。
        iphone:
          title: 也在 iPhone 上閱讀？
          body: iOS 只向主畫面上的網站傳送推播。在 iPhone 上用 Safari 開啟部落格，點一下 <b>⋯</b> → <b>分享</b> → <b>加入主畫面</b>，開啟<b>以網頁 App 開啟</b>，點一下<b>加入</b>，再從新圖示中追蹤。同一個 GitHub 帳號在所有裝置上共用一個收件匣。
        ready:
          title: 隨時可以開始
          body: 追蹤按鈕就在這裡。準備好時按下即可，接下來的步驟會依剛才示範的順序出現。
        ready_off:
          title: 以上就是全部
          body: 準備好時，按下導覽列中的<b>追蹤</b>即可，接下來的步驟會依剛才示範的順序出現。
        ready_following:
          title: 你已追蹤本部落格
          body: 所有送達的內容都匯集在鈴鐺之後。隨時可以開啟，並在其中透過<b>管理訂閱</b>調整主題或裝置。
    viewer:
      name: 圖片檢視器
      desc: 縮放、平移、切換圖片，以及查看相機參數。
      steps:
        open:
          title: 開啟圖片
          body: 按下文章中的任一圖片，或照片牆中的任一照片，它會從頁面中放大為全螢幕檢視器，其餘內容會退到後方，直到關閉為止。
        zoom:
          title: 放大
          body: 在圖片上捲動滑鼠滾輪，或以雙指捏合，即可最多放大六倍。縮放以指標所在位置或雙指之間的位置為中心。
        pan:
          title: 查看細節，然後切換
          body: 放大後拖曳圖片即可查看各處細節。兩側的箭頭、下方的箭頭與頁碼圓點可在文中所有圖片之間切換；在觸控螢幕上，滑動也能達到同樣效果。
        info:
          title: 詳細資訊與關閉
          body: 角落的資訊按鈕會顯示圖片說明；對附有相機參數的照片，還會顯示拍攝參數。按 <b>Esc</b> 或點一下圖片周圍的深色區域即可關閉檢視器。
    comments:
      name: 留言與登入
      desc: 使用 GitHub 帳號參與任一文章下的討論。
      steps:
        thread:
          title: 留言保存在 GitHub 上
          body: 每篇文章在 GitHub Discussions 中都有自己的討論串，並透過 giscus 顯示在這裡。你的留言會以 GitHub 的名稱與頭像顯示，也可以在 GitHub 上尋找、編輯或刪除。
        authorize:
          title: 透過 giscus 登入
          body: 在留言框中按下 <b>Sign in with GitHub</b>。GitHub 會請你為 <b>giscus</b> 授權——驗證你的身分、了解你可存取的資源、代表你執行操作，你寫下的內容正是由此發布。按下 <b>Authorize giscus</b> 後會回到文章，並已處於登入狀態。
        write:
          title: 撰寫、預覽、送出
          body: 在輸入框中輸入內容，支援 Markdown，包括程式碼、連結與清單。<b>Preview</b> 會在按下 <b>Comment</b> 之前顯示排版效果，回覆會附在所回覆的留言之下。
        react:
          title: 表態，並持續關注
          body: 笑臉按鈕可以用表情代替留言。同一次登入也可為照片牆中的照片按讚、追蹤本部落格——這是本站唯一需要的帳號。
