guide:
  label: 導覽
  colon: "："
  note_title: 來自作者的說明
  understand: 知道了
  more: 查看詳情
  later: 稍後
  next: 下一步
  back: 上一步
  done: 完成
  follow: 追蹤
  explore: 開始探索
  platform: 裝置
  platforms:
    windows: Windows
    macos: macOS
    ios: iPhone / iPad
    android: Android
  close: 關閉
  menu_title: 使用指南
  menu_lede: 本部落格中功能多於外觀所示的部分，各有一份示範。可隨時開啟，不會變更任何設定。
  menu_steps: "{n} 步"
  reset: 重新顯示所有提示
  reset_confirm: 再按一次以確認
  reset_done: 所有提示將重新出現
  reset_note: 已標記為「知道了」的提示會在瀏覽時重新出現，其他內容不受影響。
  lets_try: 試一試
  lets_go: 出發吧
  welcome: 你終於回來了！我們從剛才的地方繼續吧。
  prompt_down: 下面還有更多——向下滑動，我帶你去看。
  prompt_up: 下一站在上面——往回滑一點。
  prompt_idle: 還在嗎？下面還有很多內容——繼續往下滑吧。
  prompt_comments: 快讀完了——討論區就在下面，向下滑動一起參與吧。
  prompt_recommend: 離開之前——上面還有幾篇文章在等你。
  intro:
    title: 你好，我是你的導覽
    body: 我是 <b>{site}</b> 的虛擬導覽。我會帶你四處看看：怎樣關注更新、各處內容在哪裡、讓閱讀更舒服的工具，以及討論在哪裡進行。按<b>出發吧</b>開始；之後隨時可以在側邊工具的指南針裡找到我。
  tips:
    follow:
      title: 追蹤本部落格
      body: 新文章、即時筆記與公告會送達本站的收件匣；如果允許通知，也會以推播的形式送達這台裝置。只需一次 GitHub 登入，再按一下按鈕。
    bell:
      title: 收件匣在這裡
      body: 追蹤的內容依時間倒序匯集在鈴鐺之後。在其中開啟<b>管理訂閱</b>，可選擇接收的主題與接收推播的裝置。
    ios_push:
      title: iPhone 上的推播還差一步
      body: iOS 只向已加入主畫面的網站傳送通知。將本部落格加入主畫面並從圖示開啟，推播即可生效；收件匣不受此限制。
    follow_signed:
      title: 關注本部落格
      body: 新文章、即時筆記與公告會送達本站的收件匣；如果允許通知，也會以推播的形式送達此裝置。你已經登入，按一下即可完成關注。
    inbox_manage:
      title: 你的收件匣
      body: 你關注的一切都會依時間倒序出現在這裡。<b>管理訂閱</b>決定哪些訊息送達你、送達哪些裝置。
    inbox_push:
      title: 此裝置的通知
      body: 開啟後，一有新內容發布就會立刻通知你——即使沒有開啟部落格。
    inbox_topics:
      title: 選擇接收的內容
      body: 文章與即時筆記都可以個別關閉；收件匣與公告始終保持開啟。這裡的任何操作都不會取消關注。
    inbox_back:
      title: 回到通知列表
      body: 這個箭頭會回到收件匣。
    inbox_close:
      title: 設定完成
      body: 點按收件匣以外的任意位置即可關閉。之後隨時可以透過鈴鐺再次開啟。
    navbar:
      title: 所有入口都在選單中
      body: <b>文章</b>下有歸檔、標籤、分類與照片牆；<b>關於</b>與<b>連結</b>收納站內其餘頁面。
    navbar_mobile:
      title: 選單
      body: 歸檔、標籤、分類以及站內其餘頁面，都在這個按鈕之後——照片牆在<b>文章</b>之下。
    masonry:
      title: 照片牆
      body: 以瀑布流排列的相簿。任何一張照片都能以完整尺寸開啟，許多照片還附有拍攝時的相機參數。
    notes:
      title: 即時筆記
      body: 簡短的近況會以氣泡形式在這裡浮現——不必單獨成文的隻字片語。
    banner_scroll:
      title: 直達文章
      body: 這個箭頭會越過首頁橫幅，直接帶你看到部落格發布的全部內容。
    author:
      title: 作者是誰
      body: 作者，以及這裡有多少內容可讀——文章、分類與標籤，一按即達。
    author_pager:
      title: 不只一位作者
      body: 這張卡片會依序切換到每位協作者，展示各自的文章、分類與標籤。按圓點可直接跳轉，也可以滑動卡片。
    links:
      title: 所有入口
      body: 依日期的歸檔、依主題的標籤與分類、照片牆，以及作者的 GitHub——一按即達。
    pulse:
      title: 站點活躍度
      body: 每個方格代表過去一年中的一天，顏色越深，當天的造訪越多。
    post:
      title: 從這篇開始？
      body: 每個方塊都是一篇文章：大小取決於文章的篇幅，置頂文章排在最前，同一系列匯集為一欄。這一篇很適合作為開始。
    tools:
      title: 閱讀工具
      body: 齒輪會開啟每個頁面都有的工具：字體大小、深色模式、這份導覽，以及回到頂端。
    tools_font:
      title: 字體大小
      body: 放大文字；下方的按鈕可再縮小。你的選擇會在每個頁面保留。
    tools_theme:
      title: 深色或淺色
      body: 在深色與淺色主題之間切換整個部落格。
    guide_entry:
      title: 隨時重溫所有指南
      body: 這組工具中的指南針可開啟所有示範，也能讓已關閉的提示重新出現。
    tools_top:
      title: 回到頂端
      body: 顯示你已讀完頁面的多少；按一下即可直接回到頂端。
    exif_toggle:
      title: 這張照片附有相機參數
      body: 按下箭頭即可展開拍攝資訊——相機、鏡頭、曝光等。
    exif_hover:
      title: 這張照片是怎麼拍的
      body: 這張卡片列出相機、鏡頭與曝光參數。指標停留在此類照片上時就會出現，圖片檢視器中同樣可以查看。
    viewer:
      title: 開啟任一圖片
      body: 按下圖片即可以完整尺寸檢視。可以放大、拖曳查看細節，並在不離開檢視器的情況下瀏覽文中的每一張圖片。
    errorbook:
      title: 先作答，再看解析
      body: 請先自行作答。答對不會有任何提示；答錯時會展開錯誤原因的解析。
    code:
      title: 複製或摺疊程式碼
      body: 指標移到程式碼區塊上時會出現這兩個按鈕。<b>複製</b>會複製整個區塊（不含行號），箭頭則可將其摺疊。
    toc:
      title: 目錄
      body: 顯示或隱藏目錄。正在閱讀的章節會保持醒目標示，任一標題一按即達。
    comments:
      title: 參與討論
      body: 本部落格的留言基於 GitHub Discussions。使用 GitHub 登入一次後，即可在任一文章下留言、回覆與表態。
    recommend:
      title: 繼續閱讀
      body: 如果你喜歡這篇文章，這裡還有一篇你也許會喜歡——從最相近的文章中挑選。
    album_photo:
      title: 瀏覽相簿
      body: 開啟一張照片即可以完整尺寸檢視，再透過滑動或箭頭瀏覽整本相簿。
    album_heart:
      title: 為照片按讚
      body: 愛心會以你的 GitHub 帳號為照片按讚。第一次按下時需要登入，返回後按讚會自動完成。
    albums:
      title: 相簿
      body: 每張卡片都是一本相簿，開啟後照片會以瀑布流排列。
    search:
      title: 全站搜尋
      body: 輸入的同時，會檢索每篇文章的標題與全文。
  tours:
    follow:
      name: 追蹤本部落格
      desc: 新內容進入本站的收件匣並以通知送達你的裝置，以及登入的方式。
      signed_in: 你已經以 <b>@{login}</b> 登入，GitHub 相關的步驟皆已完成。
      steps:
        published:
          title: 有新內容發布時
          body: 新文章、即時筆記或公告會以兩種方式送達：裝置上的系統通知（即使部落格沒有開啟），以及導覽列鈴鐺後的收件匣，在你讀過之前會一直保留在那裡。
        install_ios:
          title: 將部落格加入主畫面
          body: iPhone 與 iPad 只向已加入主畫面的網站傳送通知。在 Safari 中點一下 <b>⋯</b>，再點一下<b>分享</b>，向下捲動到<b>加入主畫面</b>，開啟<b>以網頁 App 開啟</b>並點一下<b>加入</b>。之後從新的圖像開啟部落格，並在其中追蹤。需要 iOS 16.4 或以上版本。
        install_mac:
          title: 將部落格加入 Dock
          body: 在 Mac 上為選用步驟。在 Safari 中選擇<b>檔案 → 加入 Dock…</b>並按下<b>加入</b>，此後部落格可從 Dock 以獨立視窗開啟。無論是否加入，Safari 都會送達部落格的通知。需要 macOS Sonoma 或以上版本。
        signin:
          title: 透過 giscus 登入
          body: 追蹤使用你的 GitHub 帳號，經由同樣支撐留言區的 <b>giscus</b> 完成。按下<b>追蹤</b>後，GitHub 會請你登入以繼續前往 giscus。已有帳號時，在此登入後直接前往授權步驟。
        register:
          title: 註冊 GitHub 帳號
          body: 沒有帳號時，選擇 <b>Create an account</b>。填寫電子郵件、密碼與使用者名稱，選擇國家或地區，然後按下 <b>Create account</b>。隨後 GitHub 會請你完成一個簡短的驗證謎題，並輸入寄到信箱的驗證碼。帳號免費。
        authorize:
          title: 為 giscus 授權
          body: 首次登入時，GitHub 會詢問是否允許 giscus 驗證你的 GitHub 身分、了解你可存取的資源、代表你執行操作——你寫下的留言正是由此發布。按下 <b>Authorize</b> 即回到部落格，並已處於登入狀態。授權可隨時在 GitHub 的 Settings → Applications 中撤銷。
        allow:
          title: 追蹤，並允許通知
          body: 回到部落格後，再按一次<b>追蹤</b>。系統隨即詢問是否允許本站傳送通知：選擇<b>允許</b>即可在此裝置上接收。選擇<b>封鎖</b>仍會追蹤本部落格——所有內容照常進入收件匣，只是不再跳出通知。隨後追蹤按鈕會變為鈴鐺。
    comments:
      name: 留言與登入
      desc: 使用 GitHub 帳號參與任一文章下的討論。
      steps:
        thread:
          title: 留言保存在 GitHub 上
          body: 每篇文章在 GitHub Discussions 中都有自己的討論串，並透過 giscus 顯示在這裡。你的留言會以 GitHub 的名稱與頭像顯示，也可以在 GitHub 上尋找、編輯或刪除。
        authorize:
          title: 透過 giscus 登入
          body: 在留言框中按下 <b>Sign in with GitHub</b>。GitHub 會請你為 <b>giscus</b> 授權——驗證你的身分、了解你可存取的資源、代表你執行操作，你寫下的內容正是由此發布。按下 <b>Authorize</b> 後會回到文章，並已處於登入狀態。
        write:
          title: 撰寫、預覽、送出
          body: 在輸入框中輸入內容，支援 Markdown，包括程式碼、連結與清單。<b>Preview</b> 會在按下 <b>Comment</b> 之前顯示排版效果，回覆會附在所回覆的留言之下。
        react:
          title: 表態，並持續關注
          body: 笑臉按鈕可以用表情代替留言。同一次登入也可為照片牆中的照片按讚、追蹤本部落格——這是本站唯一需要的帳號。
