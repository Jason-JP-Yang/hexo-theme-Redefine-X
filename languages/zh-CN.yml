guide:
  label: 向导
  colon: "："
  note_title: 来自作者的说明
  understand: 知道了
  more: 查看详情
  later: 稍后
  next: 下一步
  back: 上一步
  done: 完成
  follow: 关注
  explore: 开始探索
  platform: 设备
  platforms:
    windows: Windows
    macos: macOS
    ios: iPhone / iPad
    android: Android
  close: 关闭
  menu_title: 使用指南
  menu_lede: 本博客中功能多于外观所示的部分，各有一份演示。可随时打开，不会改动任何设置。
  menu_steps: "{n} 步"
  reset: 重新显示所有提示
  reset_confirm: 再按一次以确认
  reset_done: 所有提示将重新出现
  reset_note: 已标记为“知道了”的提示会在浏览时重新出现，其他内容不受影响。
  lets_try: 试一试
  lets_go: 出发吧
  welcome: 你终于回来了！我们从刚才的地方继续吧。
  prompt_down: 下面还有更多——向下滑动，我带你去看。
  prompt_up: 下一站在上面——往回滑一点。
  prompt_idle: 还在吗？下面还有很多内容——继续往下滑吧。
  prompt_comments: 快读完了——讨论区就在下面，向下滑动一起参与吧。
  prompt_recommend: 离开之前——上面还有几篇文章在等你。
  intro:
    title: 你好，我是你的向导
    body: 我是 <b>{site}</b> 的虚拟向导。我会带你四处看看：怎样关注更新、各处内容在哪里、让阅读更舒服的工具，以及讨论在哪里进行。按<b>出发吧</b>开始；之后随时可以在侧边工具的指南针里找到我。
  tips:
    follow:
      title: 关注本博客
      body: 新文章、即时笔记与公告会送达本站的收件箱；如果允许通知，也会以推送的形式送达此设备。只需一次 GitHub 登录，再按一下按钮。
    bell:
      title: 收件箱在这里
      body: 关注的内容按时间倒序汇集在铃铛之后。在其中打开<b>管理订阅</b>，可选择接收的主题与接收推送的设备。
    ios_push:
      title: iPhone 上的推送还差一步
      body: iOS 只向已添加到主屏幕的网站发送通知。将本博客添加到主屏幕并从图标打开，推送即可生效；收件箱不受此限制。
    follow_signed:
      title: 关注本博客
      body: 新文章、即时笔记与公告会送达本站的收件箱；如果允许通知，也会以推送的形式送达此设备。你已经登录，按一下即可完成关注。
    inbox_manage:
      title: 你的收件箱
      body: 你关注的一切都会按时间倒序出现在这里。<b>管理订阅</b>决定哪些消息送达你、送达哪些设备。
    inbox_push:
      title: 此设备的通知
      body: 打开后，一有新内容发布就会立刻通知你——即使没有打开博客。
    inbox_topics:
      title: 选择接收的内容
      body: 文章与即时笔记都可以单独关闭；收件箱与公告始终保持开启。这里的任何操作都不会取消关注。
    inbox_back:
      title: 回到通知列表
      body: 这个箭头会回到收件箱。
    inbox_close:
      title: 设置完成
      body: 点按收件箱以外的任意位置即可关闭。之后随时可以通过铃铛再次打开。
    navbar:
      title: 所有入口都在菜单中
      body: <b>文章</b>下有归档、标签、分类与照片墙；<b>关于</b>与<b>链接</b>收纳站内其余页面。
    navbar_mobile:
      title: 菜单
      body: 归档、标签、分类以及站内其余页面，都在这个按钮之后——照片墙在<b>文章</b>之下。
    masonry:
      title: 照片墙
      body: 以瀑布流排布的相册。任意一张照片都可以全尺寸打开，许多照片还附有拍摄时的相机参数。
    notes:
      title: 即时笔记
      body: 简短的近况会以气泡形式在这里浮现——不必单独成文的只言片语。
    banner_scroll:
      title: 直达文章
      body: 这个箭头会越过首页横幅，直接带你看到博客发布的全部内容。
    author:
      title: 作者是谁
      body: 作者，以及这里有多少内容可读——文章、分类与标签，一按即达。
    author_pager:
      title: 不止一位作者
      body: 这张卡片会依次切换到每位合作者，展示各自的文章、分类与标签。按圆点可直接跳转，也可以滑动卡片。
    links:
      title: 所有入口
      body: 按日期的归档、按主题的标签与分类、照片墙，以及作者的 GitHub——一按即达。
    pulse:
      title: 站点活跃度
      body: 每个方格代表过去一年中的一天，颜色越深，当天的访问越多。
    post:
      title: 从这篇开始？
      body: 每个方块都是一篇文章：大小取决于文章的篇幅，置顶文章排在最前，同一系列汇集为一栏。这一篇很适合作为开始。
    tools:
      title: 阅读工具
      body: 齿轮会打开每个页面都有的工具：字体大小、深色模式、这份向导，以及回到顶部。
    tools_font:
      title: 字体大小
      body: 放大文字；下方的按钮可再缩小。你的选择会在每个页面保留。
    tools_theme:
      title: 深色或浅色
      body: 在深色与浅色主题之间切换整个博客。
    guide_entry:
      title: 随时重温所有指南
      body: 这组工具中的指南针可打开所有演示，也能让已关闭的提示重新出现。
    tools_top:
      title: 回到顶部
      body: 显示你已读完页面的多少；按一下即可直接回到顶部。
    exif_toggle:
      title: 这张照片附有相机参数
      body: 按下箭头即可展开拍摄信息——相机、镜头、曝光等。
    exif_hover:
      title: 这张照片是怎样拍摄的
      body: 这张卡片列出相机、镜头与曝光参数。指针停留在此类照片上时就会出现，图片查看器中同样可以查看。
    viewer:
      title: 打开任意图片
      body: 按下图片即可全尺寸查看。可以放大、拖动查看细节，并在不离开查看器的情况下浏览文中的每一张图片。
    errorbook:
      title: 先作答，再看解析
      body: 请先自行作答。答对不会有任何提示；答错时会展开错误原因的解析。
    code:
      title: 复制或折叠代码
      body: 指针移到代码块上时会出现这两个按钮。<b>复制</b>会复制整个代码块（不含行号），箭头则可将其折叠。
    toc:
      title: 目录
      body: 显示或隐藏目录。正在阅读的章节会保持高亮，任意标题一按即达。
    comments:
      title: 参与讨论
      body: 本博客的评论基于 GitHub Discussions。使用 GitHub 登录一次后，即可在任意文章下评论、回复与表态。
    recommend:
      title: 继续阅读
      body: 如果你喜欢这篇文章，这里还有一篇你也许会喜欢——从最相近的文章中挑选。
    album_photo:
      title: 浏览相册
      body: 打开一张照片即可全尺寸查看，再通过滑动或箭头浏览整个相册。
    album_heart:
      title: 为照片点赞
      body: 爱心会以你的 GitHub 账号为照片点赞。第一次按下时需要登录，返回后点赞会自动完成。
    albums:
      title: 相册
      body: 每张卡片都是一个相册，打开后照片会以瀑布流排布。
    search:
      title: 全站搜索
      body: 输入的同时，会检索每篇文章的标题与全文。
  tours:
    follow:
      name: 关注本博客
      desc: 新内容进入本站的收件箱并以通知送达你的设备，以及登录的方式。
      signed_in: 你已经以 <b>@{login}</b> 登录，GitHub 相关的步骤均已完成。
      steps:
        published:
          title: 有新内容发布时
          body: 新文章、即时笔记或公告会以两种方式送达：设备上的系统通知（即使博客没有打开），以及导航栏铃铛后的收件箱，在你读过之前会一直保留在那里。
        install_ios:
          title: 将博客添加到主屏幕
          body: iPhone 与 iPad 只向已添加到主屏幕的网站发送通知。在 Safari 中轻点 <b>⋯</b>，再轻点<b>共享</b>，向下滚动到<b>添加到主屏幕</b>，打开<b>作为网页 App 打开</b>并轻点<b>添加</b>。之后从新的图标打开博客，并在其中关注。需要 iOS 16.4 或更高版本。
        install_mac:
          title: 将博客放入程序坞
          body: 在 Mac 上为可选步骤。在 Safari 中选择<b>文件 → 添加到程序坞…</b>并按下<b>添加</b>，此后博客可从程序坞以独立窗口打开。无论是否添加，Safari 都会送达博客的通知。需要 macOS Sonoma 或更高版本。
        signin:
          title: 通过 giscus 登录
          body: 关注使用你的 GitHub 账号，经由同样支撑评论区的 <b>giscus</b> 完成。按下<b>关注</b>后，GitHub 会请你登录以继续前往 giscus。已有账号时，在此登录后直接前往授权步骤。
        register:
          title: 注册 GitHub 账号
          body: 没有账号时，选择 <b>Create an account</b>。填写邮箱、密码与用户名，选择国家或地区，然后按下 <b>Create account</b>。随后 GitHub 会请你完成一个简短的验证谜题，并输入发送到邮箱的验证码。账号免费。
        authorize:
          title: 为 giscus 授权
          body: 首次登录时，GitHub 会询问是否允许 giscus 验证你的 GitHub 身份、了解你可访问的资源、代表你执行操作——你写下的评论正是由此发布。按下 <b>Authorize</b> 即返回博客，并已处于登录状态。授权可随时在 GitHub 的 Settings → Applications 中撤销。
        allow:
          title: 关注，并允许通知
          body: 回到博客后，再按一次<b>关注</b>。系统随即询问是否允许本站发送通知：选择<b>允许</b>即可在此设备上接收。选择<b>阻止</b>仍会关注本博客——所有内容照常进入收件箱，只是不再弹出通知。随后关注按钮会变为铃铛。
    comments:
      name: 评论与登录
      desc: 使用 GitHub 账号参与任意文章下的讨论。
      steps:
        thread:
          title: 评论保存在 GitHub 上
          body: 每篇文章在 GitHub Discussions 中都有自己的讨论串，并通过 giscus 显示在这里。你的评论会以 GitHub 的名字与头像显示，也可以在 GitHub 上查找、编辑或删除。
        authorize:
          title: 通过 giscus 登录
          body: 在评论框中按下 <b>Sign in with GitHub</b>。GitHub 会请你为 <b>giscus</b> 授权——验证你的身份、了解你可访问的资源、代表你执行操作，你写下的内容正是由此发布。按下 <b>Authorize</b> 后会回到文章，并已处于登录状态。
        write:
          title: 撰写、预览、发送
          body: 在输入框中输入内容，支持 Markdown，包括代码、链接与列表。<b>Preview</b> 会在按下 <b>Comment</b> 之前显示排版效果，回复会附在所回复的评论之下。
        react:
          title: 表态，并持续关注
          body: 笑脸按钮可以用表情代替评论。同一次登录也可为照片墙中的照片点赞、关注本博客——这是本站唯一需要的账号。
  mock:
